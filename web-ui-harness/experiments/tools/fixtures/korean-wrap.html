<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:Pretendard;src:url(../fonts/Pretendard-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:Pretendard;src:url(../fonts/Pretendard-Bold.woff2) format("woff2");font-weight:700}
body{font-family:Pretendard,sans-serif;margin:0;padding:24px}
h1{font-size:44px;line-height:1.2;margin:0 0 16px}
.a{word-break:normal}.b{word-break:keep-all}
.fixed{width:600px;height:30px;background:#eee}
.clip{width:120px;overflow:hidden;white-space:nowrap}
.tiny{display:inline-block;width:20px;height:20px;background:#333}
</style></head><body>
<h1 class="a" id="plain">모든 팀이 한 화면에서 고객 데이터를 이해하는 가장 빠른 방법</h1>
<h1 class="b" id="keepall">모든 팀이 한 화면에서 고객 데이터를 이해하는 가장 빠른 방법</h1>
<p class="clip">잘리는 한국어 문장이 여기에 길게 들어갑니다</p>
<a class="tiny" href="#"></a><a class="tiny" href="#" ></a>
<div class="fixed">고정 폭 600px 요소</div>
</body></html>
