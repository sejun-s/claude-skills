<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>입력 정보 안내 — 알파로그</title><link rel="icon" href="assets/mark.svg"><link rel="stylesheet" href="style.css"></head><body><main class="shell" style="max-width:760px;padding-block:70px"><a class="text-link" href="index.html">← 알파로그로 돌아가기</a><h1 style="font-size:36px;margin:36px 0 24px">입력 정보 안내</h1><p>알파로그는 가상 서비스 UI 데모입니다. 회사·고객·제품 데이터와 성과 수치는 실제 운영 정보를 나타내지 않습니다.</p><p style="margin-top:20px">요청 양식에 입력한 정보는 현재 브라우저 화면에서만 처리되며 서버로 전송하거나 브라우저 저장소에 보관하지 않습니다. 새로고침하면 준비된 요청 내용이 사라집니다. 복사 버튼을 누르면 입력 내용이 클립보드에 기록됩니다.</p><p style="margin-top:20px">이 화면에는 분석 추적 도구, 외부 폼 서비스, 실제 문의 전송 기능이 없습니다. 실제 연락처와 전송 서비스 연결은 별도의 운영 작업입니다.</p></main></body></html>
